# SonarQube analysis on the shared local instance (scan from the dev machine).
# The token comes from the SONAR_TOKEN environment variable, never from this file.
sonar.projectKey=learn-to-earn
sonar.projectName=Learn To Earn
sonar.host.url=http://localhost:9000
sonar.sources=.
sonar.exclusions=.claude/**,.venv/**,scripts/test_*.py
sonar.sourceEncoding=UTF-8
sonar.tests=scripts
sonar.test.inclusions=scripts/test_*.py
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3
